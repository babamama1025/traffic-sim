<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>進階號誌時制模擬與時空圖分析工具</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <div id="main-content">
            <div id="map-container">
                <div id="map"></div>
                <div id="time-display">模擬時間：<span id="clock">0</span> 秒</div>
            </div>
        </div>

        <div id="sidebar">
            <div class="sidebar-header">
                <h2>控制面板</h2>
                <div class="file-actions">
                    <input type="file" id="file-load" accept=".json" style="display: none;">
                    <button id="btn-load" title="讀取專案" onclick="document.getElementById('file-load').click()">📂 開啟</button>
                    <button id="btn-save" title="儲存專案">💾 儲存</button>
                </div>
            </div>

            <h4 class="section-title">📁 專案 / 方案</h4>
            <div class="control-group">
                <select id="select-project" title="選擇專案"></select>
                <select id="select-plan" title="選擇時制方案"></select>
                <button id="btn-save-as-plan" hidden>＋ 另存新方案</button>
            </div>

            <h4 class="section-title">編輯</h4>
            <div class="control-group">
                <div class="segmented">
                    <button id="btn-add-node">📍 建立路口</button>
                    <button id="btn-select">🖱️ 選取</button>
                </div>
                <button id="btn-all-nodes">📋 路口總覽</button>
            </div>

            <h4 class="section-title">⏱️ 時制計畫</h4>
            <div class="control-group">
                <input type="file" id="file-load-plans" accept=".json" style="display: none;">
                <button id="btn-load-plans" onclick="document.getElementById('file-load-plans').click()">📥 匯入</button>
                <button id="btn-save-plans">📤 匯出</button>
            </div>

            <h4 class="section-title">模擬</h4>
            <div class="control-group simulation-controls">
                <button id="btn-play" class="btn-inactive">▶️ 開始模擬</button>
                <button id="btn-reset" class="btn-inactive">↩️ 重設</button>
                <div class="speed-row">
                    <span>模擬速度 <strong id="speed-display">1x</strong></span>
                    <input type="range" id="select-speed" min="1" max="32" value="1" step="1">
                </div>
                <div class="timeline-row">
                    <span>時間軸</span>
                    <input type="range" id="sim-timeline" min="0" max="0" value="0" step="1">
                    <span id="timeline-label">0 / 0 秒</span>
                </div>
            </div>

            <h4 class="section-title">分析與顯示</h4>
            <div class="control-group">
                <button id="btn-arterial">📈 幹道分析</button>
                <label class="toggle-row"><input type="checkbox" id="chk-flow" checked> 🚗 顯示車流動線</label>
            </div>

            <div id="node-status-panel" style="display:none;">
                <h3>📍 路口即時狀態</h3>
                <div id="node-status-content"></div>
            </div>

            <div id="editor-panel" style="display: none;">
                <h3>路口屬性編輯器</h3>
                <div class="form-group">
                    <label>路口編號:</label>
                    <input type="text" id="input-node-id" style="font-weight:bold;">
                </div>
                <div class="form-group">
                    <label>路口名稱:</label>
                    <input type="text" id="input-node-name" placeholder="（選填）">
                </div>
                <div id="arms-section">
                    <div class="arms-section-label">進向臂設定：</div>
                    <div id="arms-container"></div>
                    <button id="btn-add-arm" type="button">＋ 新增臂</button>
                </div>
                <div class="form-group">
                    <label>週期 (自動計算):</label>
                    <strong id="display-cycle" style="color:#007bff;">— 秒</strong>
                </div>
                <div class="form-group">
                    <label>時差 (秒):</label>
                    <input type="number" id="input-offset" value="0" min="0">
                </div>
                <div id="phases-container"></div>
                <button id="btn-add-phase">＋ 新增時相</button>
                <button id="btn-save-plan">套用設定</button>
                <button id="btn-delete-node" class="btn-danger-outline">🗑️ 刪除此路口</button>
            </div>
        </div>
    </div>

    <!-- 路口總覽 overlay -->
    <div id="all-nodes-overlay">
        <div id="all-nodes-panel">
            <div class="anp-header">
                <h3>📋 路口總覽</h3>
                <div class="anp-header-btns">
                    <button id="btn-apply-all-nodes">套用全部</button>
                    <button id="btn-close-all-nodes">✕ 關閉</button>
                </div>
            </div>
            <div id="all-nodes-container"></div>
        </div>
    </div>

    <!-- 幹道時空圖分析 overlay -->
    <div id="tsd-overlay">
        <div id="tsd-panel">
            <div class="tsd-header">
                <div class="tsd-title">
                    <button id="btn-tsd-collapse" title="收合 / 展開設定欄">◀ 設定</button>
                    <h3>📈 幹道時空圖分析</h3>
                    <span id="tsd-summary"></span>
                </div>
                <div class="tsd-header-actions">
                    <button id="tsd-btn-play" class="btn-inactive">▶️ 開始模擬</button>
                    <button id="btn-close-tsd">✕ 關閉</button>
                </div>
            </div>
            <div id="tsd-body">
                <div id="tsd-side">
                    <section class="tsd-step">
                        <div class="tsd-step-title">① 幹道設定 <span id="tsd-preset-plan" class="tsd-step-note"></span></div>
                        <select id="tsd-preset-select"></select>
                        <div class="tsd-preset-btns">
                            <button id="btn-tsd-preset-save" title="覆寫目前選取的設定">💾 儲存</button>
                            <button id="btn-tsd-preset-saveas">＋ 另存新設定</button>
                            <button id="btn-tsd-preset-rename" title="重新命名">✏️</button>
                            <button id="btn-tsd-preset-delete" title="刪除">🗑️</button>
                        </div>
                        <div id="tsd-preset-msg" class="tsd-step-note"></div>
                    </section>
                    <section class="tsd-step">
                        <div class="tsd-step-title">② 排序方向</div>
                        <select id="tsd-sort-mode">
                            <option value="WE">西 → 東</option>
                            <option value="EW">東 → 西</option>
                            <option value="SN">南 → 北</option>
                            <option value="NS">北 → 南</option>
                        </select>
                    </section>
                    <section class="tsd-step">
                        <div class="tsd-step-title">③ 路口與幹道時相</div>
                        <div class="tsd-step-note">勾選要顯示的路口；點數字選擇幹道綠燈時相（可複選）</div>
                        <div id="tsd-controls"></div>
                    </section>
                    <section class="tsd-step">
                        <div class="tsd-step-title">④ 綠寬帶</div>
                        <button id="btn-gb-toggle">🟢 繪製綠寬帶</button>
                        <div id="gb-settings" hidden>
                            <label>方向
                                <select id="gb-dir">
                                    <option value="FWD"></option>
                                    <option value="REV"></option>
                                </select>
                            </label>
                            <label>速率 <input id="gb-speed-input" type="number" value="40" min="1" max="200"> km/h</label>
                            <div id="gb-summary"></div>
                        </div>
                    </section>
                </div>
                <div id="tsd-main">
                    <span class="tsd-hint">縱軸間距依實際距離；左右拖曳圖面可回看（最多 10 分鐘），滾輪捲動路口</span>
                    <div id="tsd-canvas-wrap">
                        <canvas id="ts-canvas"></canvas>
                        <div id="tsd-scrollbar"><div id="tsd-scroll-inner"></div></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
